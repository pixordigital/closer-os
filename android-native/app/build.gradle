plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.closeros.nativeapp'
    compileSdk 34
    defaultConfig {
        applicationId "com.closeros.nativeapp"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0-native"
        vectorDrawables { useSupportLibrary true }
        // ponytail: BuildConfig field — single source for BASE, no hardcoded string in Api.kt
        buildConfigField "String", "BASE_URL", "\"http://178.105.181.38:6002/\""
    }
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('local.properties')
            if (f.exists()) { f.withInputStream { props.load(it) } }
            storeFile file('closer-release.keystore')
            storePassword props.getProperty('closer.storePassword') ?: System.getenv('CLOSER_STORE_PASSWORD') ?: ''
            keyAlias props.getProperty('closer.keyAlias') ?: System.getenv('CLOSER_KEY_ALIAS') ?: 'closer'
            keyPassword props.getProperty('closer.keyPassword') ?: System.getenv('CLOSER_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            buildConfigField "String", "BASE_URL", "\"http://178.105.181.38:6002/\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.compose.ui:ui:1.6.0'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.compose.material:material-icons-extended:1.6.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
