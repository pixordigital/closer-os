services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: closer
      POSTGRES_PASSWORD: closer
      POSTGRES_DB: closer_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closer"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_API_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-closer-evolution-key-change-me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#1988ff"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      SQS_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      DATABASE_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      LOG_COLOR: "true"
      LOG_BAILEYS: error
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started
      evolution:
        condition: service_started
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://closer:closer@db:5432/closer_os?schema=public
      LITELLM_URL: http://litellm:4000
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-closer-evolution-key-change-me}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://app:3000/api/whatsapp/webhook}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  worker:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c"]
    command: 'echo "[worker] polling /api/jobs/run every 10s"; while true; do curl -sf -X POST http://app:3000/api/jobs/run -H "Content-Type: application/json" >/dev/null 2>&1 || true; sleep 10; done'
    environment:
      APP_URL: http://app:3000

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command: --config /app/config.yaml --detailed_debug
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-closer-master}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  evolution_instances:
  evolution_store:
